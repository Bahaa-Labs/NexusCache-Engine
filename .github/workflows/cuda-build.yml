name: CUDA Kernel Compilation & Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'csrc/**'
      - 'nexuscache/**'
      - 'CMakeLists.txt'
      - 'setup.py'
      - 'Dockerfile'
      - '.github/workflows/cuda-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda-compile:
    name: NVCC Build Verification (CUDA 12.1 + PyTorch 2.3)
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.1.0-devel-ubuntu22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            python3-pip python3-dev build-essential cmake ninja-build git \
            && rm -rf /var/lib/apt/lists/*
          ln -sf /usr/bin/python3 /usr/bin/python

      - name: Install Python & Build Dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          pip3 install torch --index-url https://download.pytorch.org/whl/cu121
          pip3 install pybind11 pytest numpy ray fastapi prometheus-client pydantic

      - name: Build C++/CUDA Extensions
        run: |
          python3 setup.py build_ext --inplace
          pip3 install --no-build-isolation -e .

      - name: Test Extensions & Environment Setup
        run: |
          python3 -c "import torch; print('PyTorch CUDA available:', torch.cuda.is_available())"
          python3 -c "import nexuscache; print('NexusCache package verified')"

  docker-build:
    name: Production Container Image Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nexuscache-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  cpu-unit-tests:
    name: PyTest & CPU Mock Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU PyTorch & Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install cmake ninja pybind11 pytest pytest-cov pytest-asyncio \
                      numpy pandas scipy ray fastapi prometheus-client pydantic

      - name: Build C++ Extension Modules
        run: |
          python setup.py build_ext --inplace
          pip install --no-build-isolation -e .

      - name: Run Unit Tests with Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ --cov=nexuscache --cov-report=xml --cov-report=term-missing

      - name: Upload Code Coverage Report
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false