name: NexusCache CI/CD Core Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Quality Gate Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy clang-format

      - name: Run Linters & Formatter Checks
        run: |
          ruff check .
          black --check .
          find . -regex '.*\.\(cpp|hpp|cu|cuh\)' | xargs clang-format --dry-run --Werror
          mypy --ignore-missing-imports .

  cpu-unit-tests:
    name: PyTest & CPU Mock Suite
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU PyTorch & Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install cmake ninja pybind11 pytest pytest-cov pytest-asyncio \
                      numpy pandas scipy ray fastapi prometheus-client pydantic

      - name: Build C++ Extension Modules
        env:
          FORCE_CUDA: "0"
          MAX_JOBS: "2"
        run: |
          python setup.py build_ext --inplace
          pip install --no-build-isolation -e .

      - name: Run Unit Tests with Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ --cov=nexuscache --cov-report=xml --cov-report=term-missing

      - name: Upload Code Coverage Report
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false